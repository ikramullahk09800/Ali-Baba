<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Ali-Baba VPS</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.auth-wrap{min-height:100vh;background:radial-gradient(circle at 20% 20%,rgba(123,47,247,.35),transparent 40%),radial-gradient(circle at 80% 30%,rgba(241,7,163,.25),transparent 40%),var(--dark);display:flex;align-items:center;justify-content:center;padding:40px 20px}
.auth-card{background:#fff;border-radius:24px;padding:50px 44px;width:100%;max-width:460px;box-shadow:0 30px 80px rgba(0,0,0,.4);position:relative}
.auth-logo{text-align:center;font-size:28px;font-weight:800;margin-bottom:10px;color:#0e0a1f}
.auth-logo span{background:linear-gradient(90deg,#7b2ff7,#f107a3);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.auth-subtitle{text-align:center;color:#6f6a85;font-size:15px;margin-bottom:34px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#0e0a1f;margin-bottom:8px}
.form-group input{width:100%;padding:14px 18px;border:1.5px solid #eee9ff;border-radius:12px;font-family:inherit;font-size:15px;background:#fbfaff;color:#0e0a1f}
.form-group input:focus{outline:none;border-color:#7b2ff7;background:#fff;box-shadow:0 0 0 4px rgba(123,47,247,.1)}
.form-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;font-size:14px}
.remember{display:flex;align-items:center;gap:8px;color:#6f6a85}
.remember input{accent-color:#7b2ff7}
.forgot{color:#7b2ff7;font-weight:500;text-decoration:none}
.btn-auth{width:100%;padding:15px;background:linear-gradient(90deg,#7b2ff7,#f107a3);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:18px}
.btn-auth:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(123,47,247,.35)}
.divider{text-align:center;color:#6f6a85;font-size:13px;margin:20px 0;position:relative}
.divider:before,.divider:after{content:'';position:absolute;top:50%;width:40%;height:1px;background:#eee9ff}
.divider:before{left:0}.divider:after{right:0}
.social-btns{display:flex;gap:12px;margin-bottom:22px}
.social-btn{flex:1;padding:12px;background:#fbfaff;border:1.5px solid #eee9ff;border-radius:12px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;color:#0e0a1f}
.auth-footer{text-align:center;color:#6f6a85;font-size:14px}
.auth-footer a{color:#7b2ff7;font-weight:600;text-decoration:none}
.back-home{position:absolute;top:-50px;left:0;color:rgba(255,255,255,.7);font-size:14px;text-decoration:none}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="back-home">← Back to Home</a>
    <div class="auth-logo">Ali<span>Baba</span> VPS</div>
    <p class="auth-subtitle">Login to access your dashboard</p>
    <form onsubmit="event.preventDefault();alert('Login feature coming soon!')">
      <div class="form-group"><label>Email Address</label><input type="email" placeholder="your@email.com" required></div>
      <div class="form-group"><label>Password</label><input type="password" placeholder="••••••••" required></div>
      <div class="form-row"><label class="remember"><input type="checkbox"> Remember me</label><a href="#" class="forgot">Forgot password?</a></div>
      <button type="submit" class="btn-auth">Login to Dashboard</button>
    </form>
    <div class="divider">OR</div>
    <div class="social-btns"><button class="social-btn">🔵 Google</button><button class="social-btn">⚫ GitHub</button></div>
    <p class="auth-footer">Don't have an account? <a href="signup.html">Sign up here</a></p>
  </div>
</div>
</body>
</html>
