<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Ali-Baba Control Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#0d1117;color:#e6edf3;padding:20px}
.box{max-width:900px;margin:0 auto;background:#161b22;border:1px solid #30363d;border-radius:14px;padding:24px}
h1{font-size:24px;color:#7ee787;margin-bottom:4px}
p{color:#8b949e;font-size:13px;margin-bottom:16px}
label{display:block;font-size:12px;color:#8b949e;font-weight:700;margin:12px 0 6px}
input,select{width:100%;padding:10px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-family:monospace;font-size:13px}
textarea{width:100%;min-height:320px;padding:12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-family:monospace;font-size:13px;line-height:1.5;margin-top:6px}
.row{display:flex;gap:8px;margin-top:8px}
.row>*{flex:1}
button{padding:12px;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px}
.primary{background:#238636;color:#fff;width:100%;margin-top:12px;padding:14px;font-size:16px}
.sec{background:#21262d;color:#e6edf3;border:1px solid #30363d}
.log{margin-top:14px;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px;height:180px;overflow:auto;font-family:monospace;font-size:12px;white-space:pre-wrap}
.ok{color:#3fb950}.err{color:#f85149}.warn{color:#d29922}
</style>
</head>
<body>
<div class="box">
<h1>🎛️ Ali-Baba Control Panel</h1>
<p>Permanent panel — bookmark kar lo. Koi download nahi, koi extension nahi. Seedha browser se repo control.</p>

<label>GitHub Token (ek baar do, save ho jayega)</label>
<input id="token" type="password" placeholder="github_pat_...">

<label>Repo Files</label>
<div class="row">
<select id="fileSelect"><option value="">-- Refresh dabao --</option></select>
<button class="sec" onclick="refreshFiles()">🔄 Refresh</button>
<button class="sec" onclick="loadFile()">📥 Load</button>
</div>

<label>Ya naya/aur file path likho</label>
<input id="newPath" placeholder="jaise: index.html ya naya-page.html">

<label>Code Editor (Notepad)</label>
<textarea id="editor" spellcheck="false" placeholder="File load karo ya naya code likho...">
